{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-danger text-white">
            <h3>Eliminar Propietario</h3>
        </div>
        <div class="card-body">
            <p class="lead">
                ¿Estás seguro que deseas eliminar al propietario <strong>{{ propietario.nombre }} {{ propietario.apellido }}</strong>?
            </p>
            <p class="text-danger">Esta acción no se puede deshacer y eliminará todas sus mascotas asociadas.</p>
            
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{% url 'lista_propietarios' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
