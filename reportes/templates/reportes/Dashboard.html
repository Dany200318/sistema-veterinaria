{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">
    <h1 class="mb-4">Dashboard de la Clínica Veterinaria</h1>
    
    <div class="row">
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Citas</h5>
                </div>
                <div class="card-body">
                    <p>Aquí se mostrarán estadísticas de citas.</p>
                    <a href="{% url 'lista_citas' %}" class="btn btn-primary">Ver citas</a>
                </div>
            </div>
        </div>
        
        <div class="col-md-6 mb-4">
            <div class="card">
                <div class="card-header bg-light">
                    <h5 class="mb-0">Pacientes</h5>
                </div>
                <div class="card-body">
                    <p>Aquí se mostrarán estadísticas de pacientes.</p>
                    <a href="{% url 'lista_propietarios' %}" class="btn btn-primary">Ver propietarios</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
